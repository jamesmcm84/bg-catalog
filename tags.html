<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.5, maximum-scale=5.0">
<title>BoardVault — Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --gold: #F5A623; --gold-dk: #C47D0A; --dark: #252527; --panel: #2E2E30; --border: #3A3A3E; --text: #F0EAE0; --muted: #888; --red: #CC1A1A; }
html, body { background: #3A3A3C; color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }

header {
  background: var(--dark); border-bottom: 2px solid var(--gold);
  padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 3px; color: var(--gold); }
.logo em { color: var(--text); font-style: normal; }
.back { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #888; text-decoration: none; transition: color 0.15s; }
.back:hover { color: var(--gold); }

main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; color: var(--gold); border-left: 4px solid var(--red); padding-left: 12px; margin-bottom: 1.5rem; }

/* tag cloud */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
.tag-cloud-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; background: var(--panel); border: 1.5px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
.tag-cloud-btn:hover { border-color: var(--gold-dk); color: var(--text); }
.tag-cloud-btn.active { background: var(--gold); border-color: var(--gold); color: #111; }
.tag-count { font-size: 0.65rem; opacity: 0.7; margin-left: 3px; }

/* games list */
.tag-section { display: none; }
.tag-section.active { display: block; }
.tag-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 1rem; }
.tag-games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
.tag-game-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; text-decoration: none; color: var(--text); transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; align-items: center; }
.tag-game-card:hover { transform: translateY(-3px); border-color: var(--gold-dk); }
.tag-game-cover { width: 100%; height: 120px; background: #222; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.tag-game-cover img { width: 100%; height: 100%; object-fit: contain; background: #222; }
.tag-game-cover-ph { font-size: 2rem; }
.tag-game-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 1px; text-align: center; padding: 0.5rem 0.6rem; line-height: 1.1; color: #F4EFE5; }

.empty { text-align: center; padding: 4rem 2rem; color: #444; }
.empty h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 3px; margin-bottom: 0.5rem; }

@media (max-width: 600px) {
  header { padding: 0.85rem 1rem; }
  .tag-games-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>
<body>
<header>
  <div class="logo">Board<em>Vault</em></div>
  <a href="index.html" class="back">← Collection</a>
</header>

<main>
  <div class="section-title">Tags</div>
  <div id="content"><div style="text-align:center;padding:4rem;color:#666">
    <div style="width:36px;height:36px;border:3px solid #333;border-top-color:#F5A623;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px"></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:2px;text-transform:uppercase">Loading tags…</div>
  </div></div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxWVpfpgVg2sbBH5PszE2hoNWL7ZBXh_TdIIBQFj-sJSL2cakGfgqBBHYIDElVwI5wr/exec';
const IMG_BASE = 'https://jamesmcm84.github.io/bg-catalog';

function resolveURL(raw) {
  if (!raw) return '';
  raw = raw.trim();
  if (raw.startsWith('/')) return IMG_BASE + raw;
  return raw;
}

let allTags = [];
let activeTag = null;

async function loadTags() {
  try {
    const res = await fetch(API + '?action=getAllTags');
    allTags = await res.json();
    if (!allTags.length) {
      document.getElementById('content').innerHTML = '<div class="empty"><h2>No Tags Yet</h2><p>Add tags to your games to see them here.</p></div>';
      return;
    }
    // Check URL param for preselected tag
    const urlTag = new URLSearchParams(window.location.search).get('tag');
    render(urlTag || null);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty"><h2>Could not load</h2><p>Check your connection and try refreshing.</p></div>';
  }
}

function selectTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  render(activeTag);
}

function render(selected) {
  activeTag = selected;
  const content = document.getElementById('content');

  const cloudHtml = `<div class="tag-cloud">
    ${allTags.map(t => `
      <button class="tag-cloud-btn ${selected===t.tag?'active':''}" onclick="selectTag('${t.tag.replace(/'/g,"\\'")}')">
        ${t.tag}<span class="tag-count">(${t.games.length})</span>
      </button>`).join('')}
  </div>`;

  let gamesHtml = '';
  if (selected) {
    const tagData = allTags.find(t => t.tag === selected);
    if (tagData) {
      gamesHtml = `<div class="tag-section active">
        <div class="tag-section-title">${selected} — ${tagData.games.length} game${tagData.games.length!==1?'s':''}</div>
        <div class="tag-games-grid">
          ${tagData.games.map(g => `
            <a href="game.html?slug=${encodeURIComponent(g.slug)}" class="tag-game-card">
              <div class="tag-game-cover">
                ${g.cover ? `<img src="${resolveURL(g.cover)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'tag-game-cover-ph\'>🎲</div>'">` : '<div class="tag-game-cover-ph">🎲</div>'}
              </div>
              <div class="tag-game-title">${g.title}</div>
            </a>`).join('')}
        </div>
      </div>`;
    }
  }

  content.innerHTML = cloudHtml + gamesHtml;
}

loadTags();
</script>
</body>
</html>
